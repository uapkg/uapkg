name: Release

on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [cli, launcher]
        required: true
      version:
        description: Exact version already committed on main
        type: string
        required: true
      smoke-launcher-version:
        description: Published launcher version for CLI qualification
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.product }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'uapkg/uapkg' && github.ref == 'refs/heads/main' && github.actor_id == '10104630' && github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    outputs:
      complete: ${{ steps.status.outputs.complete }}
      current: ${{ steps.identity.outputs.current }}
    steps:
      - &authorize_release
        name: Authorize this publication attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api "repos/uapkg/uapkg/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq \
            ".actor.id == 10104630 and .triggering_actor.id == 10104630 and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .head_sha == \"$GITHUB_SHA\" and .repository.full_name == \"uapkg/uapkg\" and .path == \".github/workflows/release.yml\" and .id == $GITHUB_RUN_ID and .run_attempt == $GITHUB_RUN_ATTEMPT")"
          test "$result" = true
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Check launcher version synchronization
        run: vp run launcher:version:check
      - run: vp check
      - run: vp test run --project release-tools
      - name: Check whether verified publication can resume without rebuilding
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: vp exec node tools/release/publishNative.ts status "$RELEASE_PRODUCT" "$RELEASE_VERSION"
      - name: Validate product identity and pinned verification keys
        id: identity
        env:
          RELEASE_COMPLETE: ${{ steps.status.outputs.complete }}
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
          SMOKE_LAUNCHER_VERSION: ${{ inputs.smoke-launcher-version }}
          UAPKG_RELEASE_PUBLIC_KEY: ${{ vars.UAPKG_RELEASE_PUBLIC_KEY }}
          UAPKG_CATALOG_PUBLIC_KEY: ${{ vars.UAPKG_CATALOG_PUBLIC_KEY }}
        run: vp exec node tools/release/releaseIdentity.ts

  cli:
    needs: preflight
    if: >-
      github.repository == 'uapkg/uapkg' && github.ref == 'refs/heads/main' && github.actor_id == '10104630' && github.triggering_actor == github.actor &&
      inputs.product == 'cli' && needs.preflight.outputs.complete != 'true'
    uses: ./.github/workflows/_native.yml
    with:
      smoke-launcher-version: ${{ inputs.smoke-launcher-version }}

  launcher:
    needs: preflight
    if: >-
      github.repository == 'uapkg/uapkg' && github.ref == 'refs/heads/main' && github.actor_id == '10104630' && github.triggering_actor == github.actor &&
      inputs.product == 'launcher' && needs.preflight.outputs.complete != 'true'
    uses: ./.github/workflows/_launcher.yml

  npm:
    needs: preflight
    if: >-
      github.repository == 'uapkg/uapkg' && github.ref == 'refs/heads/main' && github.actor_id == '10104630' && github.triggering_actor == github.actor &&
      inputs.product == 'cli' && needs.preflight.outputs.current == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - *authorize_release
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run --cache -w pack:libraries
      - run: vp run --cache -w cli:build -- --production
      - run: vp -C packages/uapkg run verify:production-build
      - run: vp run release:prepare
      - name: Validate the SBOM in the packed npm CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uapkg-cli-pack"
          vp -C packages/uapkg pm pack --pack-destination "$RUNNER_TEMP/uapkg-cli-pack"
          vp exec node tools/release/verifyReleaseNotices.ts npm "$RUNNER_TEMP"/uapkg-cli-pack/uapkg-cli-*.tgz
      - name: Check whether this run will publish the CLI version
        id: npm-cli
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          exists=$(npm view @uapkg/cli versions --json | jq --arg version "$VERSION" 'index($version) != null')
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Publish npm packages independently of native assets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
        shell: bash
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NPM_CONFIG_USERCONFIG
            NPM_CONFIG_USERCONFIG=$(mktemp "$RUNNER_TEMP/npm-publish.XXXXXX")
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            npm whoami --registry=https://registry.npmjs.org/ > /dev/null
          fi
          vp run release
      - name: Verify the published CLI tarball's integrity and SBOM
        if: steps.npm-cli.outputs.exists == 'false'
        env:
          PACKAGE: '@uapkg/cli@${{ inputs.version }}'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uapkg-cli-published"
          packed=$(npm pack "$PACKAGE" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/uapkg-cli-published")
          expected=$(npm view "$PACKAGE" dist.integrity)
          test "$(jq -er '.[0].integrity' <<< "$packed")" = "$expected"
          vp exec node tools/release/verifyReleaseNotices.ts npm "$RUNNER_TEMP"/uapkg-cli-published/uapkg-cli-*.tgz

  publish:
    needs: [preflight, cli, launcher]
    if: >-
      github.repository == 'uapkg/uapkg' && github.ref == 'refs/heads/main' && github.actor_id == '10104630' && github.triggering_actor == github.actor &&
      always() && !cancelled() && needs.preflight.result == 'success' &&
      (needs.preflight.outputs.complete == 'true' || needs.cli.result == 'success' || needs.launcher.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UAPKG_RELEASE_PUBLIC_KEY: ${{ vars.UAPKG_RELEASE_PUBLIC_KEY }}
      RELEASE_PRODUCT: ${{ inputs.product }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - *authorize_release
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        if: needs.preflight.outputs.complete != 'true'
        with:
          pattern: native-${{ inputs.product }}-*
          path: dist/native-artifacts
      - name: Assemble the selected product only
        if: needs.preflight.outputs.complete != 'true'
        run: vp run release:assemble -- --input dist/native-artifacts --output dist/release --product "$RELEASE_PRODUCT"
      - name: Install pinned Minisign
        run: |
          curl --fail --location --output "$RUNNER_TEMP/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
      - name: Configure authenticated catalog pushes
        run: gh auth setup-git
      - name: Publish immutable assets, verify GitHub bytes, then commit the catalog
        env:
          UAPKG_RELEASE_SECRET_KEY: ${{ secrets.UAPKG_RELEASE_SECRET_KEY }}
        run: vp exec node tools/release/publishNative.ts publish "$RELEASE_PRODUCT" "$RELEASE_VERSION" dist/release
