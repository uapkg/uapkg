[package]
name = "uapkg-launcher"
version = "0.3.3"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"
description = "Native UAPKG launcher and verified CLI version manager"

[workspace]
members = ["crates/slim-config"]
default-members = [".", "crates/slim-config"]
resolver = "3"

[[bin]]
name = "uapkg"
path = "src/main.rs"

[features]
default = []
development = ["dep:colored"]

[dependencies]
anyhow = "1.0.104"
colored = { version = "3.1.1", optional = true }
flate2 = "1.1.11"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
uapkg-slim-config = { path = "crates/slim-config" }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"

[dev-dependencies]
portable-pty = "0.9.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
