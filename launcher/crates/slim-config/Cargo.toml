[package]
name = "uapkg-slim-config"
version.workspace = true
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"
description = "Read-only launcher configuration resolved from the shared generated schema"

[dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
